# ============================================================================
# Compute Baseline Parameters
# ============================================================================
# One-time (or annual) workflow that runs compute_baseline.R to produce
# baseline_params.rds — the fixed μ/σ used to scale Deception+ to 100±10.
#
# Without this file the daily workflow falls back to mu=1.0, sd=0.1 which
# may not reflect actual unpredictability distributions in the data.
#
# Run manually via: Actions → Compute Baseline Parameters → Run workflow
# Recompute annually (e.g. after each full season) to keep the scale current.
# ============================================================================

name: Compute Baseline Parameters

on:
  workflow_dispatch:
    inputs:
      force_recompute:
        description: 'Recompute even if baseline_params.rds already exists'
        required: false
        default: 'false'
        type: boolean

jobs:
  compute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true

      # Runs after Setup R so it can read the stored method_version. A baseline
      # written by an older scoring version encodes a scale the current code no
      # longer produces, so "the file exists" is not a reason to skip — it is a
      # reason to regenerate. The previous check skipped on existence alone, and
      # since baseline_params.rds is committed, that made every run a silent
      # no-op unless force_recompute was ticked.
      - name: Check whether the baseline needs recomputing
        id: check
        run: |
          REQUIRED=$(Rscript -e 'cat(sub("L$", "", regmatches(x <- readLines("pitch_ppi.R"), regexpr("(?<=BASELINE_METHOD_VERSION <- )[0-9]+L", x, perl = TRUE))[1]))')
          echo "Current scoring method version: ${REQUIRED}"

          if [ "${{ github.event.inputs.force_recompute }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "force_recompute requested."
          elif [ ! -f "baseline_params.rds" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "No baseline_params.rds present."
          else
            FOUND=$(Rscript -e 'p <- readRDS("baseline_params.rds"); v <- p$method_version; cat(if (is.null(v)) 1L else v)')
            HAS_SURPRISE=$(Rscript -e 'p <- readRDS("baseline_params.rds"); cat(as.integer(!is.null(p$surprise_mu) && !is.null(p$surprise_sd)))')
            echo "Stored version: ${FOUND} (Surprise+ anchor present: ${HAS_SURPRISE})"
            if [ "${FOUND}" -lt "${REQUIRED}" ] || [ "${HAS_SURPRISE}" != "1" ]; then
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Baseline is stale -> recomputing."
            else
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Baseline is current. Use force_recompute=true to regenerate anyway."
            fi
          fi

      - name: Install system dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R packages
        if: steps.check.outputs.skip == 'false'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install.packages(c(
            "dplyr", "tidyr", "purrr", "stringr", "lubridate",
            "nnet", "readr", "tibble", "forcats",
            "httr", "jsonlite", "ggplot2", "scales"
          ), repos = "https://cloud.r-project.org")
          install.packages("remotes")
          remotes::install_github("saberpowers/sabRmetrics", quiet = TRUE)
        shell: Rscript {0}

      - name: Restore Statcast cache
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: cache/
          # Try to reuse data cached by the daily workflow first
          key: statcast-baseline-${{ github.run_number }}
          restore-keys: |
            statcast-baseline-
            statcast-cache-

      - name: Compute baseline parameters
        if: steps.check.outputs.skip == 'false'
        run: |
          Rscript compute_baseline.R

      - name: Commit baseline_params.rds
        if: steps.check.outputs.skip == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add baseline_params.rds || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: compute baseline parameters for Deception+ standardization

            - Computed mu/sigma from 2023-2025 historical data (30 random splits)
            - Enables proper Deception+ = 100 +/- 10 scaling in daily analysis
            - Recompute annually with: Actions > Compute Baseline Parameters"

            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Baseline Computation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.skip }}" == "true" ]; then
            echo "**Skipped** — baseline_params.rds already exists." >> $GITHUB_STEP_SUMMARY
            echo "Use \`force_recompute=true\` to regenerate." >> $GITHUB_STEP_SUMMARY
          elif [ -f "baseline_params.rds" ]; then
            echo "**Success** — baseline_params.rds computed and committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Failed** — baseline_params.rds was not produced." >> $GITHUB_STEP_SUMMARY
          fi
